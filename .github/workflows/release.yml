# Release: build the image from the official ISO, then publish a GitHub Release with the v86 disk parts, the build manifest, the sums, the
# licences page and the source pointer. v0.1.0 publishes no ISO (owner decision, 2026-11-26). Started only by the owner, by pushing a `v*` tag or by dispatching it. Publishing is a job in
# the protected `release` environment, which waits for the owner's approval. Releases are not immutable (RL-11.1). Steps and setup are in
# docs/release.md.
#
# (c) Copyright 2026 Liminal HQ, Scott Morris
# SPDX-License-Identifier: Apache-2.0 OR MIT

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: The release tag, such as v0.1.0. The tag is created on this commit when the release is published.
        type: string
        required: true

permissions:
  contents: read

# One release at a time, and a release in progress is never cancelled. The group differs from build.yml's.
concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  # ReactOS 0.4.16, the source of the binaries in the disk parts. A test keeps these equal to reactos_liminal/licences.py.
  REACTOS_SOURCE_URL: https://github.com/reactos/reactos.git
  REACTOS_SOURCE_TAG: 0.4.16-release
  REACTOS_SOURCE_COMMIT: 822e8647792a2c43f033e3e00ed273d59f163c7b

jobs:
  plan:
    name: Check the release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      notes: ${{ steps.plan.outputs.notes }}
    steps:
      - name: Check out the code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag, the commit and the notes
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            tag="$INPUT_VERSION"
            if [ "$REF" != "refs/heads/main" ]; then
              echo "::error title=Not main::A dispatched release is built from main; this run is on $REF."
              exit 1
            fi
          else
            tag="$REF_NAME"
          fi
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error title=Bad tag::'$tag' is not a version tag such as v0.1.0."
            exit 1
          fi
          # A release is built only from a commit that is on main.
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error title=Not on main::${GITHUB_SHA} is not on main."
            exit 1
          fi
          notes="docs/releases/${tag#v}.md"
          if [ ! -s "$notes" ]; then
            echo "::error title=No release notes::$notes is missing or empty."
            exit 1
          fi
          {
            echo "tag=$tag"
            echo "notes=$notes"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: plan
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml
    with:
      require-kvm: true

  source:
    name: Source pointer
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # The pointer names the ReactOS source by tag and commit; the tag is checked against the commit, so the pointer is true.
      - name: Archive this repository and write the source pointer
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          mkdir -p "$RUNNER_TEMP/source"
          git archive --format=tar.gz --prefix="reactos-liminal-${TAG}/" -o "$RUNNER_TEMP/source/reactos-liminal-${TAG}-source.tar.gz" "$GITHUB_SHA"
          actual="$(git ls-remote "$REACTOS_SOURCE_URL" "refs/tags/${REACTOS_SOURCE_TAG}^{}" "refs/tags/${REACTOS_SOURCE_TAG}" | tail -n 1 | cut -f1)"
          if [ "$actual" != "$REACTOS_SOURCE_COMMIT" ]; then
            echo "::error title=Wrong ReactOS source::tag $REACTOS_SOURCE_TAG is $actual, expected $REACTOS_SOURCE_COMMIT."
            exit 1
          fi
          cat > "$RUNNER_TEMP/source/SOURCE.txt" <<EOF
          Source for ${TAG} of Afterglow for ReactOS (unofficial remaster by Liminal HQ Labs)

          ReactOS 0.4.16
            ${REACTOS_SOURCE_URL}, tag ${REACTOS_SOURCE_TAG}, commit ${REACTOS_SOURCE_COMMIT}.
          reactos-liminal-${TAG}-source.tar.gz
            ReactOS Liminal at this release's commit ${GITHUB_SHA}: the recipe, the tools and the patches.
          WineVDM (otvdm), installed by ReactOS Setup
            https://github.com/otya128/winevdm, the release that ReactOS 0.4.16 installs.

          Written offer: if you received this release without the source, ask at https://github.com/liminal-hq-labs/reactos-liminal/issues.
          The offer is valid for three years from the date of this release.
          EOF

      - name: Upload the source
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source
          path: ${{ runner.temp }}/source
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    name: Publish the release
    needs: [plan, build, source]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # The owner approves here. Nothing is published until they do.
    environment:
      name: release
    permissions:
      contents: write
    steps:
      - name: Check out the code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Download the release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: ${{ runner.temp }}/release-files

      - name: Download the v86 parts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: v86-parts
          path: ${{ runner.temp }}/v86-parts

      - name: Download the source
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: source
          path: ${{ runner.temp }}/source

      # The files this job downloaded are checked against the build's sums, then the sums of exactly what is attached are written.
      - name: Check the build, then write the sums of the assets
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          (
            cd "$RUNNER_TEMP/release-files"
            grep -E '  (build-manifest\.json|licences\.md|afterglow\.lock\.json)$' SHA256SUMS > wanted.sums
            [ "$(wc -l < wanted.sums)" -eq 3 ]
            "$GITHUB_WORKSPACE/rl" hash --check wanted.sums --base .
          )
          assets="$RUNNER_TEMP/assets"
          mkdir -p "$assets"
          cp "$RUNNER_TEMP/release-files/build-manifest.json" "$RUNNER_TEMP/release-files/licences.md" "$RUNNER_TEMP/release-files/afterglow.lock.json" "$assets/"
          cp "$RUNNER_TEMP"/source/*.tar.gz "$RUNNER_TEMP/source/SOURCE.txt" "$assets/"
          # The parts are already zstd files, so the folder is tarred without compression, with its manifest.json.
          tar -cf "$assets/v86-disk-parts-${TAG}.tar" -C "$RUNNER_TEMP/v86-parts" .
          ./rl hash "$assets" --base "$assets" --out "$RUNNER_TEMP/SHA256SUMS"
          mv "$RUNNER_TEMP/SHA256SUMS" "$assets/SHA256SUMS"
          ./rl hash --check "$assets/SHA256SUMS" --base "$assets"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          NOTES: ${{ needs.plan.outputs.notes }}
        run: |
          prerelease=()
          if [[ "$TAG" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$TAG" "$RUNNER_TEMP"/assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Afterglow for ReactOS ${TAG} — unofficial" \
            --notes-file "$NOTES" \
            "${prerelease[@]}"
