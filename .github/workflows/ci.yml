# One job per check, so a pull request's checks list names exactly what passed or failed.
# Language-neutral checks run as they are, then the Python checks for the `rl` pipeline.
#
# (c) Copyright 2026 Liminal HQ, Scott Morris
# SPDX-License-Identifier: Apache-2.0 OR MIT

name: CI

on:
  # Every pull request, so the pull requests of a stack, which target the branch below them, are checked too.
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  markdown:
    name: Markdown lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run markdownlint-cli2
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: '**/*.md'

  headers:
    name: Licence headers
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check SPDX headers
        run: bash scripts/check-headers.sh

  banner:
    name: Hero banner
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install SVG tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxml2-utils librsvg2-bin fonts-dejavu-core fonts-liberation

      # The runner image ships Google Chrome, which the text-fit pass drives headless.
      - name: Check the banner
        env:
          BANNER_REQUIRE_RENDER: '1'
        run: bash scripts/check-banner.sh

  shellcheck:
    name: Shell scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run shellcheck
        run: docker run --rm -v "${GITHUB_WORKSPACE}:/mnt" -w /mnt koalaman/shellcheck:stable rl scripts/*.sh tools/*.sh tools/afterfetch/*.sh

  actionlint:
    name: Workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run actionlint
        run: docker run --rm -v "${GITHUB_WORKSPACE}:/repo" -w /repo rhysd/actionlint:latest -color

  ruff:
    name: Ruff
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install ruff
        run: pipx install ruff==0.17.6

      - name: Check formatting
        run: ruff format --check

      - name: Lint
        run: ruff check

  pytest:
    name: Python tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # xorriso, genisoimage, gcab and mtools let the tests that build tiny synthetic discs and images run; QEMU tests are marked and never run here.
      - name: Install tools the tests use
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xorriso genisoimage gcab cabextract mtools zstd

      - name: Install pytest
        run: python3 -m pip install pytest==9.2.0

      - name: Run the tests
        run: python3 -m pytest

  no-binaries:
    name: No upstream binaries
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check git holds no ReactOS binary or image
        run: bash scripts/check-no-binaries.sh

  # afterfetch.exe, the coloured system-information command, built from source in the shared ci-rust image (pinned by digest). The
  # project pins its own toolchain (1.98.0 with rust-src and llvm-tools), which rustup installs here; no system package is needed because
  # the linker and objdump come with the toolchain. The job formats, lints, runs the unit tests of the pure parts on the host, builds
  # the executable, checks it (subsystem 4.0, no C runtime, Pentium instructions, imports on the allowlist) and builds it twice to
  # prove the output does not depend on the directory.
  afterfetch:
    name: afterfetch.exe
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ghcr.io/liminal-hq/ci-rust@sha256:f12097be8cc22eb5145a46bc9f75b38a67fedd5833add4392e11ce85023e64df
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        working-directory: tools/afterfetch
        run: rustup toolchain install

      - name: Check, test and build afterfetch.exe
        working-directory: tools/afterfetch
        run: bash check.sh --reproducible
