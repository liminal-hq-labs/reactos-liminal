# The base recipe: the full ReactOS 0.4.16 with the Afterglow desktop, installed unattended from the official ISO. Nothing is removed.
#
# Other recipes extend this one and change what they need (a trim profile, a payload, the names). Every input is pinned by SHA-256.
#
# (c) Copyright 2026 Liminal HQ, Scott Morris
# SPDX-License-Identifier: Apache-2.0 OR MIT

[recipe]
name = "afterglow"
description = "The full ReactOS 0.4.16 with the Afterglow desktop, from the official install ISO"

# The official release, as published on SourceForge: the zip, and the ISO inside it.
[inputs.reactos_iso]
name = "ReactOS-0.4.16-i386.iso"
url = "https://downloads.sourceforge.net/project/reactos/ReactOS/0.4.16/ReactOS-0.4.16-i386.zip"
zip_sha256 = "e5851510cf5b79ef51a76b8155dd5ef7faca1155f44d0a1d41c35b77ece4ce2a"
sha256 = "6f15ca6e1edf5527b8489958d16c54f0da0e7948c305d7c89e74687c6cbf6855"

# The Afterglow source, by commit; it carries the icon, logon and boot art as well as the style, pointers and colours. The sums are of
# the uncompressed tar GitHub serves for that commit (GitHub may recompress an archive) and of the default build of the visual style
# (classic scroll bars). Afterglow's icon map decides which icons the icon patchers replace, so a new icon set is a new commit here and
# `./rl pin recipes/afterglow.toml --afterglow REF`, which measures every hash that follows from the pin; see docs/afterglow-pin.md.
#
# This is a commit on Afterglow `main` (the icon set v2 with the hand-tuned 16 px frames, the keyline tier, and the dialog art pass: icons for the Control Panel, tray and Administrative Tools, and the About, Shut Down and Log Off bitmaps). A pin on an unmerged
# branch carries a `pre_merge` note (docs/afterglow-pin.md); a published image pins a commit on `main` or a tag (RL-24).
[inputs.afterglow]
repo = "liminal-hq/afterglow-themes"
commit = "fd023f4f147690b7055004d29fa010cd3dbd08ae"
tar_sha256 = "36febf2ad2cf9095a193eae4d24a84a3e285bd30916a2d0fb78af8418312aa50"
msstyles_sha256 = "a6b5467cfb91c0d91e2482afe2aeb567ec5ae36dedcc49b2270ffd382f15cc1a"
apply_reg = "desktop/install/afterglow-original.reg"
# The desktop wallpaper: the Dusk scheme (the one apply_reg selects) is dark, so its signature scene, the smooth dusk wallpaper, rendered
# from its SVG master to the 1024 x 768 BMP. The sum is of that BMP. Other scenes: dusk-light-smooth, or any palette, mode and style
# under assets/wallpapers/ in the Afterglow source.
wallpaper = "dusk-dark-smooth"
wallpaper_sha256 = "71cdfd787f10cc1e1dbf361920857073914769899ba6b6c1a569909a063c825d"

# The ISO writer. The disc's bytes depend on it, so the lock records it and a build with another writer is reported.
[iso]
writer = "genisoimage 1.1.11"
volume = "ReactOS"
epoch = 1756425600

# The unattended answers. Neutral names; a consumer recipe sets its own.
[install]
locale = "0409"
time_zone_index = 85
computer_name = "REACTOS"
owner_name = "ReactOS user"
classic_shell = true

[settings]
display_width = 1024
display_height = 768
page_file = "64 64"
icon_size = 32
wallpaper = "C:\\ReactOS\\Web\\Wallpaper\\Dusk.bmp"
wallpaper_style = "fill"
reg_files = ["display", "quiet", "watermark-off", "afterglow-logon", "regional-canada", "pointer-defaults"]

# The wallpapers Display Properties lists. `scenes = "all"` puts every Afterglow scene (the five palettes, dark and light, smooth and stepped:
# 20 BMPs of 2.3 MB) in `C:\ReactOS\Web\Wallpaper`, named for people ("Dusk"), and `replace_stock` removes ReactOS's
# own wallpapers (`profiles/wallpapers/stock.txt`) so the list holds only Afterglow's. The sums are in `pins/afterglow-wallpapers.json`. The
# desktop wallpaper above is one of them. afterglow-compact.toml sets both back: the compact image carries only its one wallpaper.
[wallpapers]
scenes = "all"
replace_stock = true

# The Afterglow sound scheme: original sounds synthesized by `rl image` itself (reactos_liminal/sounds.py, pinned by SHA-256 in
# `pins/afterglow-sounds.json`) and written to `C:\ReactOS\Media`, and the registry that adds the scheme to Control Panel, Sounds and Audio
# Devices, selects it and makes it the current sounds (so the startup chime plays at the first logon of a boot, and the system plays the
# rest). `samples` also writes the `C:\Sounds` folder, with a five-second tune and a stereo check, for Media
# Player's File, Open. Both are off by default; every image from this recipe has both (docs/sounds.md).
[sounds]
scheme = true
samples = true

# Which files the trim removes: none, or base (the compact trim; keeps the network drivers and stack). This recipe is the full
# ReactOS and removes nothing; afterglow-compact.toml extends it with the base profile. A downstream recipe adds its own removals with
# `extra`, a list of trim files beside that recipe.
[trim]
profile = "none"

# Patchers run before the trim, each on the stock file it was written for. The pointer patch makes the Afterglow pointers the system
# pointers (it patches a copy of user32.dll). The Start patch writes agexplorer.exe, a copy of explorer.exe with the Afterglow Start orb
# and menu banner, and the settings step makes it the Winlogon shell. The logon patch writes agmsgina.dll with the Afterglow banner and bar, and the
# afterglow-logon registry file above selects it (delete that one value for the stock logon). The icon patchers put the Afterglow icon set in copies of shell32.dll,
# the Control Panel applets and the programs (including agexplorer.exe and agmsgina.dll, on top of the copies the Start and logon patchers made, so those are listed
# first), and write the Explorer toolbar cells in place; the dialog bitmaps patch writes the About, Log Off and Shut Down art last. The colours patch puts the Afterglow desktop colours in the colour table of win32k.sys, so the screen is never ReactOS's blue before the logon (RL-57). Patchers leave alone a file the
# trim removes (RL-53.3). The boot patch writes agntoskr.exe with
# the Afterglow boot logo and a boot menu whose first entry, "ReactOS (Afterglow)", starts it; the stock entry stays as the fallback.
[patchers]
list = [
	"afterglow.pointers",
	"afterglow.start",
	"afterglow.logon",
	"afterglow.icons",
	"afterglow.cpl-icons",
	"afterglow.program-icons",
	"afterglow.dialog-icons",
	"afterglow.map-icons",
	"afterglow.toolbar-bitmaps",
	"afterglow.dialog-bitmaps",
	"afterglow.colours",
	"afterglow.boot",
]

# Programs built from source when the image is built, each from a project in this repository with its own pinned toolchain. The output is
# pinned by SHA-256 like every other input (the build is reproducible); `./rl pin` measures it. `[[files]]` writes it with `built:NAME`.
[builds.afterfetch]
source = "../tools/afterfetch"
sha256 = "63d628cb4eecd0c5734a5c504bfd97ca2ec307c412fd2f8f10aae13f2fd5d4a2"

# The Afterglow screensavers, built from source at a pinned commit of their own repository: six i586 `.scr` files from one workspace
# (docs/recipes.md, Screensavers). The commit is the one line to swap, `./rl pin recipes/afterglow.toml --savers REF` moves it and measures
# the tar sum and every output's SHA-256, and each `.scr` is a standalone file (no shared DLL). The build also makes AGQUILL.SCR, the Quill
# Ghostwriter saver; a recipe that carries it (the Quill remix) declares its sum in its own `[builds.afterglow-savers.outputs]` and writes it.
# No saver is selected: the Screen Saver list shows "(None)" until someone picks one, and ReactOS lists every `.scr` in the system folder
# by its own name, so the five show with no registry entry. The full image keeps ReactOS's own savers beside them; the compact image's trim
# removes those and leaves the Afterglow five.
[builds.afterglow-savers]
repo = "liminal-hq-labs/afterglow-savers"
commit = "d99859406032da2dc36dc0b24d5e9fa29986e01f"
tar_sha256 = "d04e8a5b206c8f8ea11e80d99702545d87176d954071718b4154c7a78fa3d578"
script = "scripts/build-scr.sh"

[builds.afterglow-savers.outputs]
"AGMAZE.SCR" = "08a686e4ff3127aa2aa1dc52a6a6c3ba70fdd814fb139b7a41bcfb6773ece59b"
"AGCRACK.SCR" = "12eb1196f9f9b0fc8149588966380ddc06b29674fd40eadc4b13e47d015798d2"
"AGTWILIT.SCR" = "370282ca203447c2ee02b20c830dfc5b937a81089d5fc796d38fd3286a3e41eb"
"AGINK.SCR" = "b88950ec17cc4b8e7ec089201346a7444bc2774cc3529f41e1a6eeb476037870"
"AGCOLLCT.SCR" = "fa7aa7e07a2980f2a92ab11badc25442cfcaa9db9662bd1ddaca98701baa49e3"

# Files written into the image. `afterfetch` is a small system-information command with an Afterglow logo, run from the command prompt;
# it sits in system32, so it is on the PATH. The native program in colour is `afterfetch.exe`, which the command prompt finds before the
# batch file; `afterfetch.cmd` stays as the plain-text fallback. `neofetch`, `fastfetch`, `screenfetch` and `winfetch` are one-line shims that
# run `afterfetch.exe` (docs/afterfetch.md).
[[files]]
source = "built:afterfetch"
destination = "ReactOS/system32/afterfetch.exe"

[[files]]
source = "../guest/cmd/afterfetch.cmd"
destination = "ReactOS/system32/afterfetch.cmd"

[[files]]
source = "../guest/cmd/neofetch.cmd"
destination = "ReactOS/system32/neofetch.cmd"

[[files]]
source = "../guest/cmd/fastfetch.cmd"
destination = "ReactOS/system32/fastfetch.cmd"

[[files]]
source = "../guest/cmd/screenfetch.cmd"
destination = "ReactOS/system32/screenfetch.cmd"

[[files]]
source = "../guest/cmd/winfetch.cmd"
destination = "ReactOS/system32/winfetch.cmd"

[[files]]
source = "built:afterglow-savers/AGMAZE.SCR"
destination = "ReactOS/system32/AGMAZE.SCR"

[[files]]
source = "built:afterglow-savers/AGCRACK.SCR"
destination = "ReactOS/system32/AGCRACK.SCR"

[[files]]
source = "built:afterglow-savers/AGTWILIT.SCR"
destination = "ReactOS/system32/AGTWILIT.SCR"

[[files]]
source = "built:afterglow-savers/AGINK.SCR"
destination = "ReactOS/system32/AGINK.SCR"

[[files]]
source = "built:afterglow-savers/AGCOLLCT.SCR"
destination = "ReactOS/system32/AGCOLLCT.SCR"

# "Sound test" on the desktop opens Media Player on the five-second tune, so a sound check is one double-click.
[[shortcuts]]
name = "Sound test"
target = 'C:\ReactOS\system32\mplay32.exe'
arguments = '"C:\Sounds\Dusk melody.wav"'
working_dir = 'C:\Sounds'
description = "Plays a short tune in Media Player to check the sound"

[outputs.disk]
zero_free = true

# Each part of the disk is one file for v86. 8 MiB is the default until the part size is measured.
[outputs.parts]
chunk_size = "8MiB"
zstd_level = 19
