# The base recipe: the full ReactOS 0.4.16 with the Afterglow desktop, installed unattended from the official ISO. Nothing is removed.
#
# Other recipes extend this one and change what they need (a trim profile, a payload, the names). Every input is pinned by SHA-256.
#
# (c) Copyright 2026 Liminal HQ, Scott Morris
# SPDX-License-Identifier: Apache-2.0 OR MIT

[recipe]
name = "afterglow"
description = "The full ReactOS 0.4.16 with the Afterglow desktop, from the official install ISO"

# The official release, as published on SourceForge: the zip, and the ISO inside it.
[inputs.reactos_iso]
name = "ReactOS-0.4.16-i386.iso"
url = "https://downloads.sourceforge.net/project/reactos/ReactOS/0.4.16/ReactOS-0.4.16-i386.zip"
zip_sha256 = "e5851510cf5b79ef51a76b8155dd5ef7faca1155f44d0a1d41c35b77ece4ce2a"
sha256 = "6f15ca6e1edf5527b8489958d16c54f0da0e7948c305d7c89e74687c6cbf6855"

# The Afterglow source, by commit; it carries the icon, logon and boot art as well as the style, pointers and colours. The sums are of
# the uncompressed tar GitHub serves for that commit (GitHub may recompress an archive) and of the default build of the visual style
# (classic scroll bars). Afterglow's icon map decides which icons the icon patchers replace, so a new icon set is a new commit here and
# `./rl pin recipes/afterglow.toml --afterglow REF`, which measures every hash that follows from the pin; see docs/afterglow-pin.md.
#
# This is a commit on Afterglow `main` (the icon set v2 with the hand-tuned 16 px frames, the taskbar tray fix and the keyline tier: page icons, toolbar glyphs and light objects). A pin on an unmerged
# branch carries a `pre_merge` note (docs/afterglow-pin.md); a published image pins a commit on `main` or a tag (RL-24).
[inputs.afterglow]
repo = "liminal-hq/afterglow-themes"
commit = "0ab3b272046f0e4e777653945c03238e5040b5cb"
tar_sha256 = "bfc0d57a0a280646d7c787dd1dbb700f66a90272f47992d4afa01d37ca7f0460"
msstyles_sha256 = "2512dfd6be320295698717487c24bee2eb8b38ed64f351aa42bfd26b3dc81f4f"
apply_reg = "desktop/install/afterglow-original.reg"
# The desktop wallpaper: the Dusk scheme (the one apply_reg selects) is dark, so its signature scene, the smooth dusk wallpaper, rendered
# from its SVG master to the 1024 x 768 BMP. The sum is of that BMP. Other scenes: dusk-light-smooth, or any palette, mode and style
# under assets/wallpapers/ in the Afterglow source.
wallpaper = "dusk-dark-smooth"
wallpaper_sha256 = "71cdfd787f10cc1e1dbf361920857073914769899ba6b6c1a569909a063c825d"

# The unattended answers. Neutral names; a consumer recipe sets its own.
[install]
locale = "0409"
time_zone_index = 85
computer_name = "REACTOS"
owner_name = "ReactOS user"
classic_shell = true

[settings]
display_width = 1024
display_height = 768
page_file = "64 64"
icon_size = 32
wallpaper = "C:\\ReactOS\\afterglow-wallpaper.bmp"
wallpaper_style = "stretch"
reg_files = ["display", "quiet", "watermark-off", "afterglow-logon", "regional-canada", "pointer-defaults"]

# Which files the trim removes: none, or base (the compact trim; keeps the network drivers and stack). This recipe is the full
# ReactOS and removes nothing; afterglow-compact.toml extends it with the base profile. A downstream recipe adds its own removals with
# `extra`, a list of trim files beside that recipe.
[trim]
profile = "none"

# Patchers run before the trim, each on the stock file it was written for. The pointer patch makes the Afterglow pointers the system
# pointers (it patches a copy of user32.dll). The Start patch writes agexplorer.exe, a copy of explorer.exe with the Afterglow Start orb
# and menu banner, and the settings step makes it the Winlogon shell. The icon patchers put the Afterglow icon set in copies of shell32.dll,
# the Control Panel applets and the programs, and write the Explorer toolbar cells in place. The logon patch writes agmsgina.dll with the Afterglow banner and bar, and the
# afterglow-logon registry file above selects it (delete that one value for the stock logon). The boot patch writes agntoskr.exe with
# the Afterglow boot logo and a boot menu whose first entry, "ReactOS (Afterglow)", starts it; the stock entry stays as the fallback.
[patchers]
list = [
	"afterglow.pointers",
	"afterglow.start",
	"afterglow.icons",
	"afterglow.cpl-icons",
	"afterglow.program-icons",
	"afterglow.toolbar-bitmaps",
	"afterglow.logon",
	"afterglow.boot",
]

# Programs built from source when the image is built, each from a project in this repository with its own pinned toolchain. The output is
# pinned by SHA-256 like every other input (the build is reproducible); `./rl pin` measures it. `[[files]]` writes it with `built:NAME`.
[builds.afterfetch]
source = "../tools/afterfetch"
sha256 = "63d628cb4eecd0c5734a5c504bfd97ca2ec307c412fd2f8f10aae13f2fd5d4a2"

# Files written into the image. `afterfetch` is a small system-information command with an Afterglow logo, run from the command prompt;
# it sits in system32, so it is on the PATH. The native program in colour is `afterfetch.exe`, which the command prompt finds before the
# batch file; `afterfetch.cmd` stays as the plain-text fallback. `neofetch`, `fastfetch`, `screenfetch` and `winfetch` are one-line shims that
# run `afterfetch.exe` (docs/afterfetch.md).
[[files]]
source = "built:afterfetch"
destination = "ReactOS/system32/afterfetch.exe"

[[files]]
source = "../guest/cmd/afterfetch.cmd"
destination = "ReactOS/system32/afterfetch.cmd"

[[files]]
source = "../guest/cmd/neofetch.cmd"
destination = "ReactOS/system32/neofetch.cmd"

[[files]]
source = "../guest/cmd/fastfetch.cmd"
destination = "ReactOS/system32/fastfetch.cmd"

[[files]]
source = "../guest/cmd/screenfetch.cmd"
destination = "ReactOS/system32/screenfetch.cmd"

[[files]]
source = "../guest/cmd/winfetch.cmd"
destination = "ReactOS/system32/winfetch.cmd"

[outputs.disk]
zero_free = true

# Each part of the disk is one file for v86. 8 MiB is the default until the part size is measured.
[outputs.parts]
chunk_size = "8MiB"
zstd_level = 19
